---
layout: default
---

<style>

/* =========================
   HERO IMAGE
   ========================= */

.lab-image {
  width: 100%;
  overflow: hidden;
}

.lab-image img {
  width: 100%;
  
  /* responsive height */
  height: clamp(320px, 60vh, 750px);

  object-fit: cover;

  /* move focus upward so heads are not cropped */
  object-position: center 20%;

  display: block;
}

/* Short laptop screens */
@media (max-height: 700px) {
  .lab-image img {
    height: 50vh;
    object-position: center 15%;
  }
}

/* Very wide screens */
@media (min-width: 1600px) {
  .lab-image img {
    height: 65vh;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .lab-image img {
    height: auto;
    max-height: none;
    object-fit: contain;
  }
}
/* =========================
   BODY RESET
   ========================= */
body {
  margin: 0;
}

</style>

<!-- =========================
     HERO IMAGE
========================= -->
<div class="lab-image">
  <img src="{{ '/images/gallery/beiko_lab_photo.jpg' | relative_url }}" alt="Beiko Lab Photo">
</div>

<!-- =========================
     CONTENT
========================= -->
<div class="container-fluid">
  <div class="content-wrapper">
    {{ content }}
  </div>
</div>

<!-- =========================
     CAROUSEL
========================= -->
<div class="container-fluid">
  <div id="carousel" class="carousel slide" data-ride="carousel" data-interval="5000">

    <ol class="carousel-indicators">
      {% for file in site.data.slider %}
      <li data-target="#carousel"
          data-slide-to="{{ forloop.index0 }}"
          class="{% if forloop.first %}active{% endif %}">
      </li>
      {% endfor %}
    </ol>

    <div class="carousel-inner">
      {% for file in site.data.slider %}
      <div class="item {% if forloop.first %}active{% endif %}">
        <img src="{{ '/images/slider/' | append: file | relative_url }}"
             alt="Slide {{ forloop.index }}">
      </div>
      {% endfor %}
    </div>

    <a class="left carousel-control" href="#carousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
    </a>

    <a class="right carousel-control" href="#carousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
    </a>

  </div>
</div>
